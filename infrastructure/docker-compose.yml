version: "3.8"

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: decor_finder
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ../api
      dockerfile: ../infrastructure/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/decor_finder
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis
    volumes:
      - ../api:/app

  worker:
    build:
      context: ../
      dockerfile: infrastructure/Dockerfile.worker
    command: celery -A workers.tasks.ingest_aliexpress worker --loglevel=info -Q ingestion
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/decor_finder
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis

volumes:
  pgdata:
